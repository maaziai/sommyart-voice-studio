name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Capacitor (not saved to package.json)
        run: npm install --no-save --no-package-lock @capacitor/core@^6 @capacitor/android@^6 @capacitor/cli@^6

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icons from assets/
        run: npx --yes @capacitor/assets@^3 generate --android

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sommyart-labs-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the website (public/downloads)
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/sommyart-labs.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/sommyart-labs.apk
          git commit -m "Update Android APK" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main
